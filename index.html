<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Shadow Blades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@700&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07070d;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#000}
  #touch{display:none;position:fixed;left:0;right:0;bottom:12px;justify-content:space-between;padding:0 16px;pointer-events:none}
  #touch .pad{display:flex;gap:10px;pointer-events:auto}
  #touch button{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:#fff;font-size:24px;touch-action:none}
  #touch button:active{background:rgba(255,210,63,.4)}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="pad"><button data-k="arrowleft">◀</button><button data-k="arrowright">▶</button><button data-k="arrowup">▲</button></div>
  <div class="pad"><button data-k="e">⟳</button><button data-k="k">🛡</button><button data-k="j">⚔</button><button data-k="l">★</button></div>
</div>
<script>
'use strict';
const W = 960, H = 540, GROUND = 450, MAXD = W - 100;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1;

// ---------- Data ----------
const WEAPONS = {
  katana:     { name: 'Katana',     dmg: 11, range: 80,  dur: 20, cd: 8,  kb: 5 },
  nunchaku:   { name: 'Nunchaku',   dmg: 5,  range: 60,  dur: 11, cd: 3,  kb: 2.5 },
  bo:         { name: 'Bo Staff',   dmg: 9,  range: 110, dur: 26, cd: 10, kb: 9 },
  kusarigama: { name: 'Kusarigama', dmg: 8,  range: 165, dur: 34, cd: 14, kb: 4 },
  shuriken:   { name: 'Shuriken',   dmg: 6,  range: 600, dur: 14, cd: 14, kb: 2, ranged: true },
  sai:        { name: 'Sai',        dmg: 7,  range: 62,  dur: 13, cd: 5,  kb: 3 },
  tonfa:      { name: 'Tonfa',      dmg: 9,  range: 66,  dur: 17, cd: 6,  kb: 8 },
  naginata:   { name: 'Naginata',   dmg: 12, range: 135, dur: 30, cd: 12, kb: 7 },
  claws:      { name: 'Tekko-kagi', dmg: 6,  range: 55,  dur: 10, cd: 3,  kb: 2, lifesteal: 0.4 },
  blowgun:    { name: 'Fukiya',     dmg: 3,  range: 600, dur: 16, cd: 18, kb: 0.5, ranged: true, proj: 'dart' },
  kunai:      { name: 'Kunai',      dmg: 8,  range: 600, dur: 14, cd: 20, kb: 3, ranged: true, proj: 'kunai' },
  kama:       { name: 'Twin Kama',  dmg: 5,  range: 68,  dur: 22, cd: 8,  kb: 3, hits: 2 },
  tessen:     { name: 'Tessen',     dmg: 6,  range: 72,  dur: 18, cd: 8,  kb: 12, reflect: true },
  kanabo:     { name: 'Kanabo',     dmg: 18, range: 85,  dur: 40, cd: 18, kb: 12, guardBreak: true },
  yumi:       { name: 'Yumi Bow',   dmg: 10, range: 600, dur: 26, cd: 22, kb: 5, ranged: true, proj: 'arrow' },
  odachi:     { name: 'Ōdachi',     dmg: 16, range: 125, dur: 36, cd: 16, kb: 10 },
  smoke:      { name: 'Kemuridama', dmg: 9,  range: 600, dur: 16, cd: 28, kb: 5, ranged: true, proj: 'bomb' },
  caltrops:   { name: 'Tetsubishi', dmg: 5,  range: 600, dur: 14, cd: 30, kb: 1, ranged: true, proj: 'caltrop' },
  yari:       { name: 'Jumonji Yari', dmg: 10, range: 150, dur: 22, cd: 9, kb: 6 },
  hook:       { name: 'Kaginawa',   dmg: 6,  range: 600, dur: 18, cd: 34, kb: 2, ranged: true, proj: 'hook' },
};
const ORDER = ['katana', 'nunchaku', 'bo', 'kusarigama', 'shuriken', 'sai', 'tonfa', 'naginata', 'claws', 'blowgun', 'kunai', 'kama', 'tessen', 'kanabo', 'yumi', 'odachi', 'smoke', 'caltrops', 'yari', 'hook'];
const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'r', 't', 'y', 'u', 'i', 'o', 'p', 'f', 'g', 'h'];
const SPECIALS = { katana: 'Shadow Dash', nunchaku: 'Dragon Flurry', bo: 'Earth Breaker', kusarigama: 'Serpent Chain', shuriken: 'Storm of Stars',
  sai: 'Iron Parry', tonfa: 'Whirlwind', naginata: 'Crescent Moon', claws: 'Tiger Pounce', blowgun: 'Poison Cloud',
  kunai: 'Kunai Rain', kama: 'Twin Reaper', tessen: 'Gale Fan', kanabo: 'Oni Smash', yumi: 'Fire Arrow',
  odachi: 'Crescent Wave', smoke: 'Vanishing Smoke', caltrops: 'Caltrop Field', yari: 'Falling Dragon', hook: 'Grapple Slam' };
const SPECIAL_RANGE = { katana: 280, nunchaku: 75, bo: 300, kusarigama: 270, shuriken: 600, sai: 90, tonfa: 80, naginata: 220, claws: 300, blowgun: 500, kunai: 600, kama: 90, tessen: 200, kanabo: 140, yumi: 600, odachi: 400, smoke: 500, caltrops: 300, yari: 350, hook: 500 };
const STAGES = [
  { name: 'Kage', title: 'The Shadow',       weapon: 'nunchaku',   color: '#b8322a', accent: '#ff8a7a', hp: 90,  aggr: 0.06, block: 0.15, dodge: 0.2, speed: 0.85 },
  { name: 'Ryu',  title: 'Chain Serpent',    weapon: 'kusarigama', color: '#6c3fb5', accent: '#c4a2ff', hp: 110, aggr: 0.09, block: 0.3,  dodge: 0.4, speed: 0.95 },
  { name: 'Oni',  title: 'Master of Blades', weapon: 'katana',     color: '#2b2b35', accent: '#f2c14e', hp: 140, aggr: 0.13, block: 0.45, dodge: 0.6, speed: 1.05, switcher: true },
  { name: 'Hana',    title: 'Blossom Reaper',   weapon: 'kama',       color: '#c8467e', accent: '#ffc0dc', hp: 130, aggr: 0.12, block: 0.4,  dodge: 0.5,  speed: 1.05 },
  { name: 'Tetsu',   title: 'Iron Ogre',        weapon: 'kanabo',     color: '#5a5f6a', accent: '#ff9a3c', hp: 170, aggr: 0.11, block: 0.35, dodge: 0.3,  speed: 0.9 },
  { name: 'Kaze',    title: 'Wind Dancer',      weapon: 'tessen',     color: '#2a8a7a', accent: '#9ff0dc', hp: 150, aggr: 0.14, block: 0.5,  dodge: 0.6,  speed: 1.1 },
  { name: 'Tsukiko', title: 'Moon Archer',      weapon: 'yumi',       color: '#b8b0cc', accent: '#7a6aff', hp: 150, aggr: 0.15, block: 0.5,  dodge: 0.65, speed: 1.1 },
  { name: 'Kuro',    title: 'The Last Shogun',  weapon: 'naginata',   color: '#141018', accent: '#c040ff', hp: 200, aggr: 0.17, block: 0.55, dodge: 0.7,  speed: 1.15, switcher: true },
];
STAGES[2].boss = STAGES[7].boss = true;
const MORE_RIVALS = [
  ['Mizu', 'Koi Spirit', 'nunchaku', '#2a6a9a', '#9fd8ff'], ['Akane', 'Crimson Warlord', 'katana', '#8a1010', '#ffb000'],
  ['Sugi', 'Cedar Hermit', 'bo', '#4a6a3a', '#c8e0a0'], ['Hotaru', 'Lantern Dancer', 'tessen', '#d07a20', '#ffe0a0'],
  ['Koori', 'Frost Monk', 'sai', '#6a8ab0', '#e0f0ff'], ['Raiden', 'Thunder Fist', 'tonfa', '#3a3a6a', '#ffe040'],
  ['Ume', 'Plum Empress', 'naginata', '#a0306a', '#ffd0e8'], ['Hai', 'Ash Wraith', 'caltrops', '#4a4a4a', '#c8c8c8'],
  ['Asahi', 'Dawn Blade', 'odachi', '#d06030', '#fff0b0'], ['Take', 'Bamboo Viper', 'kusarigama', '#2a5a2a', '#a0ff80'],
  ['Arashi', 'Storm Sailor', 'hook', '#2a4a6a', '#80c0ff'], ['Chiyo', 'Blood Moon Queen', 'kama', '#5a0a14', '#ff4060'],
  ['Fuji', 'Wisteria Ghost', 'blowgun', '#7a5aa8', '#e0c8ff'], ['Inaba', 'Terrace Guard', 'yari', '#5a7a4a', '#ffd080'],
  ['Sakura', 'Petal Storm', 'shuriken', '#e080a0', '#fff0f6'], ['Yurei', 'Lantern Phantom', 'kusarigama', '#c8d0e0', '#60a0ff'],
  ['Kinme', 'Golden Ronin', 'katana', '#a07818', '#fff0a0'], ['Fubuki', 'Blizzard Fang', 'claws', '#e0e8f0', '#4080c0'],
  ['Kaji', 'Forge Titan', 'kanabo', '#6a2a10', '#ff7020'], ['Hoshi', 'Star Seer', 'yumi', '#20285a', '#c0c8ff'],
  ['Ame', 'Monsoon Blade', 'sai', '#3a5a6a', '#a0e0e0'], ['Ryujin', 'Jade Dragon', 'naginata', '#1a6a4a', '#80ffc0'],
  ['Yuki', 'Silent Snow', 'kunai', '#d8e0f0', '#8090c0'], ['Homura', 'Inferno Monk', 'tonfa', '#a02010', '#ffc040'],
  ['Getsu', 'Eclipse Twin', 'kama', '#18181c', '#ff8040'], ['Kiri', 'Fog Assassin', 'smoke', '#6a6a7a', '#d0d0ff'],
  ['Raijin', 'Thunder God', 'kanabo', '#30204a', '#a0e0ff'], ['Tenshi', 'Cloud Walker', 'tessen', '#e8e0f8', '#a080ff'],
  ['Yami', 'Void Stalker', 'claws', '#0c0610', '#8040ff'], ['Shinobi-Ou', 'The Shadow Master', 'katana', '#111116', '#ffd23f'],
];
MORE_RIVALS.forEach(([name, title, weapon, color, accent], k) => {
  const n = STAGES.length + 1, d = k / (MORE_RIVALS.length - 1);
  const boss = n % 5 === 0 || k === MORE_RIVALS.length - 1;
  STAGES.push({
    name, title, weapon, color, accent, boss, switcher: boss,
    hp: Math.round((160 + d * 100) * (boss ? 1.25 : 1)), aggr: 0.12 + d * 0.1,
    block: Math.min(0.75, 0.42 + d * 0.33), dodge: Math.min(0.8, 0.5 + d * 0.3), speed: 1 + d * 0.25,
  });
});

// ---------- State ----------
const STATE = { s: 'title', t: 0, stage: 0, pick: 0 };
const SAVE_KEY = 'shadowBlades.progress';
let progress = { unlocked: 1, stars: {} };
try { const sv = JSON.parse(localStorage.getItem(SAVE_KEY)); if (sv && sv.unlocked) progress = { unlocked: sv.unlocked, stars: sv.stars || {} }; } catch (e) {}
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(progress)); } catch (e) {} }
let tapAt = null;
let player = null, enemy = null, projs = [], parts = [], pops = [], petals = [];
let shake = 0, hitstop = 0, slow = 0, ann = null, frame = 0, flashA = 0, muted = false;
const isTouch = matchMedia('(pointer:coarse)').matches;

// ---------- Utils ----------
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a), 0, 255);
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

// ---------- Audio ----------
let AC = null, noiseBuf = null;
function initAudio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
}
function env(g, t, vol, dur) { g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function tone(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  env(g, t, vol, dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, q = 1) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = 'bandpass'; fl.frequency.value = freq; fl.Q.value = q;
  env(g, t, vol, dur); s.connect(fl).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(n) {
  switch (n) {
    case 'swing': noise(0.13, 0.25, 3000, 0.8); break;
    case 'throw': noise(0.08, 0.2, 5000, 2); tone(1400, 700, 0.08, 'triangle', 0.05); break;
    case 'hit': noise(0.1, 0.35, 900, 0.7); tone(160, 60, 0.14, 'triangle', 0.35); break;
    case 'bighit': noise(0.2, 0.45, 600, 0.6); tone(110, 40, 0.25, 'sawtooth', 0.25); break;
    case 'block': tone(2200, 1800, 0.09, 'square', 0.06); tone(3300, 2900, 0.07, 'triangle', 0.06); break;
    case 'special': tone(220, 880, 0.3, 'sawtooth', 0.1); noise(0.3, 0.15, 2000, 0.5); break;
    case 'slam': tone(90, 30, 0.4, 'sawtooth', 0.3); noise(0.35, 0.4, 300, 0.5); break;
    case 'swap': tone(900, 1200, 0.05, 'square', 0.04); break;
    case 'ko': tone(300, 50, 0.9, 'sawtooth', 0.2); break;
    case 'thunder': noise(1.1, 0.35, 140, 0.4); tone(70, 30, 0.9, 'sawtooth', 0.12); break;
  }
}

// ---------- Input ----------
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'escape'].includes(k)) e.preventDefault();
  if (k === 'm') muted = !muted;
  initAudio();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); keys[k] = true; pressed[k] = true; pressed.tap = true; });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => { keys[k] = false; });
});
let slotClick = null;
cv.addEventListener('pointerdown', e => {
  initAudio();
  const r = cv.getBoundingClientRect(), gx = (e.clientX - r.left) / r.width * W, gy = (e.clientY - r.top) / r.height * H;
  if (STATE.s === 'select') { tapAt = { x: gx, y: gy }; return; }
  if (STATE.s === 'fight' && player) {
    const { n, sw, sh, gap, x0, y0 } = slotLayout();
    const i = Math.floor((gx - x0) / (sw + gap));
    if (gy >= y0 && gy <= y0 + sh && i >= 0 && i < n && gx - x0 - i * (sw + gap) <= sw) { slotClick = i; return; }
  }
  pressed.tap = true;
});
function clearPressed() { for (const k in pressed) delete pressed[k]; }

// ---------- Fighters ----------
function makeFighter(o) {
  return Object.assign({
    x: 0, y: GROUND, vx: 0, vy: 0, facing: 1, hp: 100, maxHp: 100, hpShow: 100, energy: 0,
    weapon: 'katana', atk: 0, atkDur: 1, cd: 0, hasHit: false, block: false, stun: 0, onGround: true,
    walk: 0, special: null, specT: 0, flash: 0, blockFlash: 0, dead: false, deadT: 0, trail: [], speed: 1,
  }, o);
}

function inReach(f, o, range) {
  const dx = (o.x - f.x) * f.facing;
  return dx > -15 && dx < range + 20 && Math.abs(o.y - f.y) < 80;
}

function hit(a, d, dmg, kb, launch = 0, melee = true, dir = a.facing) {
  if (d.dead) return false;
  const hx = d.x - dir * 12, hy = d.y - 55;
  if (d.special === 'sai') {
    d.special = null; d.blockFlash = 14; flashA = 0.3;
    sparks(hx, hy, '#ffd23f', 18, 7); sfx('block');
    pops.push({ x: d.x, y: d.y - 125, text: 'COUNTER!', t: 0, color: '#ffd23f', big: true });
    if (Math.abs(a.x - d.x) < 140) { d.facing = a.x >= d.x ? 1 : -1; hit(d, a, 14, 10, 6, true, d.facing); }
    return false;
  }
  if (d.block && d.facing === -dir && melee && WEAPONS[a.weapon].guardBreak) {
    d.hp -= dmg * 0.5; d.block = false; d.stun = 28; d.vx = dir * kb * 0.6; d.flash = 10;
    sparks(hx, hy, '#ff9a3c', 16, 7); sfx('bighit'); shake = Math.max(shake, 10); hitstop = Math.max(hitstop, 5);
    pops.push({ x: d.x, y: d.y - 110, text: 'GUARD BREAK', t: 0, color: '#ff9a3c', big: true });
    if (d.hp <= 0) { d.hp = 0; d.dead = true; d.vy = -9; d.vx = dir * 7; d.onGround = false; d.stun = 0; }
    return true;
  }
  if (d.block && d.facing === -dir) {
    d.hp = Math.max(1, d.hp - dmg * 0.15);
    d.vx = dir * kb * 0.7; d.blockFlash = 10;
    sparks(hx, hy, '#bfe3ff', 12, 6); sfx('block');
    d.energy = Math.min(100, d.energy + 5);
    if (melee) a.cd = Math.max(a.cd, 14);
    shake = Math.max(shake, 3);
    pops.push({ x: d.x, y: d.y - 100, text: 'BLOCK', t: 0, color: '#9fd4ff' });
    return false;
  }
  d.hp -= dmg; d.vx = dir * kb;
  if (launch) { d.vy = -launch; d.onGround = false; }
  d.stun = 10 + Math.min(20, dmg); d.atk = 0; d.special = null; d.trail = []; d.block = false; d.flash = 10;
  sparks(hx, hy, '#ffffff', 8, 7); sparks(hx, hy, a.accent, 10, 5);
  shake = Math.max(shake, Math.min(16, 4 + dmg * 0.6));
  if (melee) hitstop = Math.max(hitstop, 3 + (dmg / 6 | 0));
  a.energy = Math.min(100, a.energy + dmg * 1.5);
  const ls = WEAPONS[a.weapon].lifesteal;
  if (ls && melee && !a.dead) a.hp = Math.min(a.maxHp, a.hp + dmg * ls);
  d.energy = Math.min(100, d.energy + dmg * 0.7);
  pops.push({ x: d.x + (Math.random() - 0.5) * 20, y: d.y - 100, text: String(Math.round(dmg)), t: 0, color: dmg >= 15 ? '#ffd23f' : '#fff' });
  sfx(dmg >= 15 ? 'bighit' : 'hit');
  if (d.hp <= 0) { d.hp = 0; d.dead = true; d.vy = -9; d.vx = dir * 7; d.onGround = false; d.stun = 0; }
  return true;
}

function startSpecial(f) {
  f.energy = 0; f.special = f.weapon; f.specT = 0; f.hasHit = false; f.block = false; f.dive = false;
  flashA = 0.45; sfx('special');
  pops.push({ x: f.x, y: f.y - 125, text: SPECIALS[f.weapon].toUpperCase(), t: 0, color: f.accent, big: true });
}
function endSpecial(f) { f.special = null; f.trail = []; }

function updateSpecial(f, o) {
  const t = ++f.specT;
  switch (f.special) {
    case 'katana':
      f.vx = f.facing * 17;
      f.trail.push({ x: f.x, y: f.y }); if (f.trail.length > 6) f.trail.shift();
      if (!f.hasHit && Math.abs(o.x - f.x) < 55 && Math.abs(o.y - f.y) < 80) { f.hasHit = true; hit(f, o, 24, 13, 7); }
      if (t >= 16) { f.vx = f.facing * 3; endSpecial(f); }
      break;
    case 'nunchaku':
      f.vx = f.facing * 2.2;
      if (t % 6 === 3) sfx('swing');
      if (t % 6 === 0 && inReach(f, o, 75)) hit(f, o, 4, t >= 36 ? 10 : 1.5, t >= 36 ? 8 : 0);
      if (t >= 36) endSpecial(f);
      break;
    case 'bo':
      if (t === 1) { f.vy = -13; f.onGround = false; }
      f.vx = Math.abs(o.x - f.x) > 50 ? f.facing * 4 : 0;
      if (t > 4 && f.onGround) {
        f.facing = o.x >= f.x ? 1 : -1;
        if (Math.abs(o.x - f.x) < 70) hit(f, o, 12, 9, 10);
        projs.push({ type: 'wave', x: f.x + f.facing * 30, y: GROUND, vx: f.facing * 9, owner: f, dmg: 18, kb: 9, launch: 10, life: 55 });
        shake = 12; dust(f.x, GROUND, 20); sfx('slam'); f.vx = 0; endSpecial(f);
      }
      if (t > 90) endSpecial(f);
      break;
    case 'kusarigama':
      f.vx *= 0.8;
      if (t === 1) { projs.push({ type: 'chain', x: f.x + f.facing * 25, y: f.y - 55, vx: f.facing * 16, owner: f, dmg: 16, kb: 2, life: 20 }); sfx('throw'); }
      if (t >= 24) endSpecial(f);
      break;
    case 'shuriken':
      f.vx *= 0.8;
      if (t === 2) {
        for (let i = -2; i <= 2; i++) projs.push({ type: 'shuriken', x: f.x + f.facing * 25, y: f.y - 60, vx: f.facing * 11 * Math.cos(i * 0.12), vy: i * 1.1, owner: f, dmg: 7, kb: 3, rot: 0, life: 80 });
        sfx('throw');
      }
      if (t >= 16) endSpecial(f);
      break;
    case 'sai':
      f.vx *= 0.7;
      if (t >= 45) endSpecial(f);
      break;
    case 'tonfa':
      f.vx = f.facing * 3.5;
      if (t % 8 === 4) sfx('swing');
      if (t % 8 === 0 && Math.abs(o.x - f.x) < 75 && Math.abs(o.y - f.y) < 80) {
        const last = t >= 40;
        hit(f, o, 5, last ? 10 : 3, last ? 8 : 0, true, o.x >= f.x ? 1 : -1);
      }
      if (t >= 40) endSpecial(f);
      break;
    case 'naginata':
      if (t === 1) { f.vy = -11; f.onGround = false; }
      f.vx = f.facing * 6;
      if (!f.hasHit && Math.abs(o.x - f.x) < 115 && (o.x - f.x) * f.facing > -20 && Math.abs(o.y - f.y) < 100) { f.hasHit = true; hit(f, o, 22, 10, 11); }
      if (t > 4 && f.onGround) { f.vx = 0; dust(f.x, GROUND, 10); endSpecial(f); }
      if (t > 90) endSpecial(f);
      break;
    case 'claws':
      if (t === 1) { f.vy = -10; f.onGround = false; f.vx = clamp((o.x - f.x) / 28, -14, 14); }
      if (!f.hasHit && Math.abs(o.x - f.x) < 45 && Math.abs(o.y - f.y) < 85) { f.hasHit = true; hit(f, o, 18, 6, 5); }
      if (t > 4 && f.onGround) endSpecial(f);
      if (t > 90) endSpecial(f);
      break;
    case 'kunai':
      f.vx *= 0.8;
      if (t === 2) {
        const tx = o.x + o.vx * 14;
        for (let i = 0; i < 6; i++) projs.push({ type: 'kunai', x: tx + (i - 2.5) * 18, y: GROUND - 330 - i * 14, vx: 0, vy: 17, owner: f, dmg: 6, kb: 2, life: 90 });
        sfx('throw');
      }
      if (t >= 18) endSpecial(f);
      break;
    case 'kama':
      f.vx = f.facing * 6;
      if (t % 5 === 2) sfx('swing');
      if (t % 5 === 0 && inReach(f, o, 65)) { const last = t >= 30; hit(f, o, 4, last ? 10 : 2, last ? 8 : 0); }
      if (t >= 30) endSpecial(f);
      break;
    case 'tessen':
      f.vx *= 0.8;
      if (t === 4) { projs.push({ type: 'gust', x: f.x + f.facing * 30, y: f.y - 50, vx: f.facing * 10, vy: 0, owner: f, dmg: 12, kb: 22, launch: 4, life: 45 }); sfx('special'); }
      if (t >= 20) endSpecial(f);
      break;
    case 'kanabo':
      f.vx *= 0.7;
      if (t === 20) {
        shake = 18; dust(f.x + f.facing * 50, GROUND, 30); sfx('slam');
        if (Math.abs(o.x - f.x) < 150 && o.y > GROUND - 60) hit(f, o, 28, 12, 12, true, o.x >= f.x ? 1 : -1);
      }
      if (t >= 32) endSpecial(f);
      break;
    case 'yumi':
      f.vx *= 0.7;
      if (t === 10) { projs.push({ type: 'arrow', fire: true, x: f.x + f.facing * 25, y: f.y - 64, vx: f.facing * 20, vy: 0, owner: f, dmg: 24, kb: 12, launch: 6, life: 60 }); sfx('throw'); }
      if (t >= 22) endSpecial(f);
      break;
    case 'odachi':
      f.vx *= 0.7;
      if (t === 8) {
        projs.push({ type: 'crescent', x: f.x + f.facing * 40, y: f.y - 55, vx: f.facing * 13, vy: 0, owner: f, dmg: 20, kb: 10, launch: 6, life: 50 });
        sfx('special'); if (inReach(f, o, 110)) hit(f, o, 10, 8, 4);
      }
      if (t >= 22) endSpecial(f);
      break;
    case 'smoke':
      if (t === 1) {
        smokePuff(f.x, f.y - 40); f.x = o.x - o.facing * 60; f.vx = 0;
        f.facing = o.x >= f.x ? 1 : -1; smokePuff(f.x, f.y - 40); sfx('throw');
      }
      if (t === 7 && inReach(f, o, 80)) hit(f, o, 18, 8, 5);
      if (t >= 16) endSpecial(f);
      break;
    case 'caltrops':
      f.vx *= 0.8;
      if (t === 3) { for (let i = 0; i < 8; i++) projs.push(caltrop(f, 3 + i * 1.1, -5 - Math.random() * 3)); sfx('throw'); }
      if (t >= 14) endSpecial(f);
      break;
    case 'yari':
      if (t === 1) { f.facing = o.x >= f.x ? 1 : -1; f.vy = -15; f.onGround = false; f.vx = clamp((o.x - f.x) / 40, -9, 9); }
      if (t > 2 && f.vy > 0 && !f.dive) { f.dive = true; f.vy = 14; f.vx = f.facing * 6; sfx('swing'); }
      if (f.dive && !f.hasHit && Math.abs(o.x - f.x) < 60 && Math.abs(o.y - f.y) < 90) { f.hasHit = true; hit(f, o, 24, 9, 8); }
      if ((t > 4 && f.onGround) || t > 90) { f.dive = false; dust(f.x, GROUND, 16); shake = Math.max(shake, 8); endSpecial(f); }
      break;
    case 'hook':
      f.vx *= 0.8;
      if (t === 3) { projs.push({ type: 'hook', x: f.x + f.facing * 25, y: f.y - 58, vx: f.facing * 17, vy: 0, owner: f, dmg: 18, kb: 2, launch: 14, life: 30, pullTarget: true }); sfx('throw'); }
      if (t >= 20) endSpecial(f);
      break;
    case 'blowgun':
      f.vx *= 0.8;
      if (t === 2) { projs.push({ type: 'cloud', x: f.x + f.facing * 40, y: f.y - 50, vx: f.facing * 4, vy: 0, owner: f, life: 150, r: 10 }); sfx('throw'); }
      if (t >= 16) endSpecial(f);
      break;
  }
}

function fireProj(f, w) {
  const base = { x: f.x + f.facing * 25, vy: 0, owner: f, dmg: w.dmg, kb: w.kb, rot: 0 };
  if (w.proj === 'dart') projs.push({ ...base, type: 'dart', y: f.y - 66, vx: f.facing * 14, poison: 150, life: 70 });
  else if (w.proj === 'kunai') projs.push({ ...base, type: 'kunai', y: f.y - 62, vx: f.facing * 15, life: 70 });
  else if (w.proj === 'arrow') projs.push({ ...base, type: 'arrow', y: f.y - 64, vx: f.facing * 19, life: 60 });
  else if (w.proj === 'bomb') {
    const o = f === player ? enemy : player, dist = o ? Math.abs(o.x - f.x) : 300;
    projs.push({ ...base, type: 'bomb', y: f.y - 70, vx: f.facing * clamp(dist / 38, 3, 11), vy: -9, grav: 0.5, life: 120 });
  } else if (w.proj === 'caltrop') projs.push(caltrop(f, 6, -6));
  else if (w.proj === 'hook') projs.push({ ...base, type: 'hook', y: f.y - 58, vx: f.facing * 17, life: 26 });
  else projs.push({ ...base, type: 'shuriken', y: f.y - 60, vx: f.facing * 11, life: 90 });
}
function caltrop(f, sp, vy) {
  return { type: 'caltrop', x: f.x + f.facing * 20, y: f.y - 50, vx: f.facing * sp, vy, grav: 0.5, owner: f, dmg: 5, kb: 1, life: 400, rot: 0 };
}
function smokePuff(x, y) {
  for (let i = 0; i < 18; i++) parts.push({ x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 50, vx: (Math.random() - 0.5) * 1.5, vy: -0.3 - Math.random() * 0.6, life: 40, max: 40, color: 'rgba(150,150,165,0.55)', size: 8 + Math.random() * 10, grav: 0, round: true });
}
function explode(p, t) {
  sparks(p.x, p.y - 10, '#ffb347', 16, 6); smokePuff(p.x, Math.min(p.y, GROUND - 20));
  shake = Math.max(shake, 7); sfx('slam');
  if (!t.dead && Math.abs(t.x - p.x) < 70 && t.y > GROUND - 160) hit(p.owner, t, p.dmg, p.kb, 4, false, Math.sign(t.x - p.x) || 1);
}

function updateFighter(f, c, o) {
  if (f.cd > 0) f.cd--;
  if (f.flash > 0) f.flash--;
  if (f.blockFlash > 0) f.blockFlash--;
  if (f.slowT > 0) f.slowT--;
  if (f.poison > 0) {
    f.poison--;
    if (!f.dead) {
      f.hp -= 0.08;
      if (frame % 6 === 0) parts.push({ x: f.x + (Math.random() - 0.5) * 24, y: f.y - 60 - Math.random() * 30, vx: 0, vy: -0.8, life: 24, max: 24, color: '#7dff6a', size: 3, grav: 0 });
      if (f.hp <= 0) { f.hp = 0; f.dead = true; f.vy = -6; f.onGround = false; f.stun = 0; f.special = null; f.atk = 0; }
    }
  }
  let mv = 0;
  if (f.dead) { /* ragdoll */ }
  else if (f.stun > 0) { f.stun--; f.block = false; }
  else if (f.special) updateSpecial(f, o);
  else {
    if (c.weapon) f.nextWeapon = c.weapon;
    if (f.nextWeapon && f.atk === 0) {
      if (f.nextWeapon !== f.weapon) { f.weapon = f.nextWeapon; if (!f.isAI) sfx('swap'); }
      f.nextWeapon = null;
    }
    f.block = !!c.block && f.onGround && f.atk === 0;
    mv = (c.right ? 1 : 0) - (c.left ? 1 : 0);
    if (f.atk === 0 && !o.dead) f.facing = o.x >= f.x ? 1 : -1;
    if (c.jump && f.onGround && !f.block) { f.vy = -13.5; f.onGround = false; dust(f.x, GROUND, 6); }
    if (c.special && f.energy >= 100 && f.atk === 0) startSpecial(f);
    else if (c.attack && f.atk === 0 && f.cd === 0 && !f.block) {
      const w = WEAPONS[f.weapon];
      f.atk = f.atkDur = w.dur; f.hasHit = false; f.hitMask = 0; sfx(w.ranged ? 'throw' : 'swing');
    }
  }
  if (!f.special) {
    const sp = (f.block ? 0 : f.atk > 0 ? 1.5 : 4.6) * f.speed * (f.slowT > 0 ? 0.5 : 1);
    if (mv) f.vx += (mv * sp - f.vx) * 0.3;
    else f.vx *= f.onGround ? 0.78 : 0.97;
  }
  if (f.atk > 0) {
    const w = WEAPONS[f.weapon], p = 1 - f.atk / f.atkDur;
    if (w.ranged) {
      if (!f.hasHit && p >= 0.35) { f.hasHit = true; fireProj(f, w); }
    } else {
      const wins = w.hits === 2 ? [0.3, 0.6] : [0.35];
      wins.forEach((st, i) => {
        if (!(f.hitMask & (1 << i)) && p >= st && p <= st + 0.35 && inReach(f, o, w.range)) { f.hitMask |= 1 << i; f.hasHit = true; hit(f, o, w.dmg, w.kb); }
      });
    }
    if (--f.atk === 0) f.cd = w.cd;
  }
  f.vy += 0.7; f.x += f.vx; f.y += f.vy;
  if (f.y >= GROUND) { f.y = GROUND; if (!f.onGround) { f.onGround = true; dust(f.x, GROUND, 5); } f.vy = 0; }
  f.walk += Math.abs(f.vx) * 0.09;
  f.hpShow = f.hpShow > f.hp ? Math.max(f.hp, f.hpShow - 0.6) : f.hp;
  if (f.dead) f.deadT = Math.min(1, f.deadT + 0.05);
}

function separate() {
  if (player.dead || enemy.dead || player.special === 'katana' || enemy.special === 'katana') return;
  const dx = enemy.x - player.x;
  if (Math.abs(dx) < 40 && Math.abs(enemy.y - player.y) < 70) {
    const push = (40 - Math.abs(dx)) / 2 * (Math.sign(dx) || 1);
    player.x -= push; enemy.x += push;
  }
}

function updateProjs() {
  for (const p of projs) {
    if (p.grav) p.vy += p.grav;
    p.life--; p.x += p.vx; p.y += p.vy || 0; p.rot = (p.rot || 0) + (p.landed ? 0 : 0.5);
    const t = p.owner === player ? enemy : player;
    if (p.type === 'cloud') {
      p.r = Math.min(70, p.r + 2); p.vx *= 0.98;
      if (!t.dead && Math.abs(p.x - t.x) < p.r + 15 && Math.abs(p.y - (t.y - 50)) < p.r + 30) {
        t.poison = Math.max(t.poison || 0, 90); t.slowT = 10;
        if (!p.hit) { p.hit = true; pops.push({ x: t.x, y: t.y - 110, text: 'POISONED', t: 0, color: '#7dff6a' }); }
      }
      continue;
    }
    if (p.type === 'bomb') {
      if (p.y >= GROUND - 6 || (!t.dead && Math.abs(p.x - t.x) < 20 && p.y > t.y - 92 && p.y < t.y)) { explode(p, t); p.life = 0; }
      continue;
    }
    if (p.type === 'caltrop') {
      if (!p.landed && p.y >= GROUND - 3) { p.landed = true; p.y = GROUND - 3; p.vx = p.vy = p.grav = 0; }
      if (p.landed && !t.dead && t.onGround && Math.abs(t.x - p.x) < 18) {
        t.block = false;
        if (hit(p.owner, t, p.dmg, p.kb, 0, false, Math.sign(t.x - p.x) || 1)) t.slowT = 60;
        p.life = 0;
      }
      continue;
    }
    const thin = p.type === 'shuriken' || p.type === 'dart' || p.type === 'kunai' || p.type === 'arrow' || p.type === 'hook';
    if (thin && !p.fire && t.weapon === 'tessen' && t.atk > 0 && !t.dead) {
      const tp = 1 - t.atk / t.atkDur;
      if (tp > 0.15 && tp < 0.85 && Math.abs(p.x - t.x) < 75 && Math.sign(p.vx) === Math.sign(t.x - p.x) && t.facing === Math.sign(p.x - t.x)) {
        p.owner = t; p.vx = -p.vx * 1.2; p.vy = -(p.vy || 0); p.seen = false; p.life = 70;
        sparks(p.x, p.y, '#ffffff', 10, 5); sfx('block');
        pops.push({ x: t.x, y: t.y - 110, text: 'REFLECT', t: 0, color: '#9fd4ff' });
        continue;
      }
    }
    if (!t.dead) {
      let col = false;
      if (thin) col = Math.abs(p.x - t.x) < 20 && p.y > t.y - 92 && p.y < t.y + 4;
      else if (p.type === 'crescent') col = Math.abs(p.x - t.x) < 36 && Math.abs(p.y - (t.y - 50)) < 70;
      else if (p.type === 'gust') col = Math.abs(p.x - t.x) < 40 && Math.abs(p.y - (t.y - 50)) < 90;
      else if (p.type === 'wave') col = Math.abs(p.x - t.x) < 32 && t.y > GROUND - 40;
      else if (p.type === 'chain') col = Math.abs(p.x - t.x) < 26 && Math.abs(p.y - (t.y - 50)) < 55;
      if (col) {
        const dir = Math.sign(p.vx) || 1;
        const landed = hit(p.owner, t, p.dmg, p.kb, p.launch || 0, false, dir);
        if (p.poison && landed) t.poison = Math.max(t.poison || 0, p.poison);
        if (p.type === 'hook' && landed && !t.dead) {
          if (p.pullTarget) t.vx = -dir * 12;
          else { const o = p.owner; o.vx = dir * 15; o.vy = -5; o.onGround = false; }
        }
        if (p.type === 'chain' && landed && !t.dead) { t.vx = -dir * 15; t.vy = -4; t.onGround = false; t.stun = 30; }
        p.life = 0;
      }
    }
    if (p.type === 'wave' && p.life % 3 === 0) dust(p.x, GROUND, 2);
    if (p.fire && frame % 2 === 0) parts.push({ x: p.x, y: p.y, vx: -p.vx * 0.1, vy: -Math.random(), life: 16, max: 16, color: Math.random() < 0.5 ? '#ff9a3c' : '#ffd23f', size: 4, grav: 0 });
    if (p.y > GROUND + 5 || p.x < camX - 120 || p.x > camX + W + 120) p.life = 0;
  }
  projs = projs.filter(p => p.life > 0);
}

// ---------- AI ----------
function aiControl(f, o, S) {
  const c = {}, ai = f.ai;
  if (f.dead || o.dead) return c;
  ai.think++;
  const dx = o.x - f.x, dist = Math.abs(dx), dir = Math.sign(dx) || 1;
  if (S.switcher && f.atk === 0 && !f.special && ai.think % 45 === 0) {
    const pick = a => a[Math.random() * a.length | 0];
    c.weapon = dist > 280 ? pick(['shuriken', 'blowgun', 'kunai', 'yumi', 'smoke', 'caltrops', 'hook']) : dist > 140 ? pick(['kusarigama', 'naginata', 'tessen', 'yari', 'odachi']) : pick(['katana', 'bo', 'tonfa', 'sai', 'claws', 'kama', 'kanabo']);
  }
  const w = WEAPONS[c.weapon || f.weapon];
  if (ai.blockT > 0) { ai.blockT--; c.block = true; return c; }

  // React to incoming melee / specials
  const startedAtk = (o.atk > 0 && o.atkDur - o.atk === 3) || (o.special && o.specT === 2);
  if (startedAtk && dist < WEAPONS[o.weapon].range + 80 && Math.random() < S.block) {
    ai.blockT = 14 + (Math.random() * 10 | 0); c.block = true; return c;
  }
  // React to projectiles
  for (const p of projs) {
    if (p.owner !== o || p.seen) continue;
    if (Math.abs(p.x - f.x) < 150 && Math.sign(p.vx) === Math.sign(f.x - p.x)) {
      p.seen = true;
      const r = Math.random();
      if (r < S.dodge * 0.6) c.jump = true;
      else if (r < S.dodge) { ai.blockT = 20; c.block = true; return c; }
    }
  }
  // Movement
  const pref = w.ranged ? 330 : Math.max(45, w.range * 0.7);
  if (ai.moveT-- <= 0) {
    ai.moveT = 10 + (Math.random() * 20 | 0);
    if (dist > pref + 15) ai.moveDir = dir;
    else if (dist < pref * 0.6) ai.moveDir = -dir;
    else { const r = Math.random(); ai.moveDir = r < 0.3 ? -dir : r < 0.65 ? dir : 0; }
  }
  if (ai.moveDir > 0) c.right = true; else if (ai.moveDir < 0) c.left = true;
  // Attack
  const inRange = w.ranged ? (dist > 120 && Math.abs(o.y - f.y) < 60) : dist < w.range + 10;
  if (inRange && f.cd === 0 && f.atk === 0 && Math.random() < S.aggr) c.attack = true;
  if (f.energy >= 100 && dist < SPECIAL_RANGE[f.weapon] && Math.random() < 0.04) c.special = true;
  if (f.onGround && Math.random() < 0.003) c.jump = true;
  return c;
}

function playerControls() {
  const c = {
    left: keys.a || keys.arrowleft, right: keys.d || keys.arrowright,
    jump: pressed.w || pressed.arrowup || pressed[' '],
    block: keys.s || keys.arrowdown || keys.k || keys.x,
    attack: keys.j || keys.z, special: pressed.l || pressed.c,
  };
  for (let i = 0; i < ORDER.length; i++) if (pressed[KEYS[i]]) c.weapon = ORDER[i];
  if (slotClick !== null) { c.weapon = ORDER[slotClick]; slotClick = null; }
  if (pressed.e || pressed.q) { const i = ORDER.indexOf(player.weapon); c.weapon = ORDER[(i + (pressed.e ? 1 : ORDER.length - 1)) % ORDER.length]; }
  return c;
}

// ---------- Particles ----------
function sparks(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd + 1;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 18 + Math.random() * 12, max: 30, color, size: 2 + Math.random() * 2, grav: 0.15 });
  }
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - 0.5) * 30, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2, life: 25, max: 25, color: 'rgba(200,170,140,0.6)', size: 4 + Math.random() * 4, grav: 0 });
}
function announce(text, sub, max) { ann = { text, sub, t: 0, max }; }
for (let i = 0; i < 28; i++) petals.push({ x: Math.random() * W, y: Math.random() * H, vx: 0.4 + Math.random() * 0.6, vy: 0.5 + Math.random() * 0.7, rot: Math.random() * 6, s: 2 + Math.random() * 2.5 });

// ---------- Flow ----------
function openMap() {
  STATE.s = 'select';
  if (player) STATE.pick = Math.min(STATE.stage + (STATE.earned && progress.unlocked > STATE.stage + 1 ? 1 : 0), STAGES.length - 1);
  else STATE.pick = Math.min(progress.unlocked - 1, STAGES.length - 1);
  STATE.earned = 0; player = null; enemy = null; projs = []; ann = null;
}

function startStage(i) {
  STATE.stage = i;
  const S = STAGES[i];
  setTown(i % TOWNS.length);
  player = makeFighter({ x: 250, facing: 1, color: '#2563c9', accent: '#ffd23f', name: 'YOU', weapon: player ? player.weapon : 'katana' });
  enemy = makeFighter({ x: 710, facing: -1, color: S.color, accent: S.accent, name: S.name.toUpperCase(), weapon: S.weapon, hp: S.hp, maxHp: S.hp, hpShow: S.hp, speed: S.speed, isAI: true, ai: { blockT: 0, moveDir: 0, moveT: 0, think: 0 } });
  projs = []; parts = []; pops = [];
  STATE.s = 'intro'; STATE.t = 0;
  updateCam(true);
  STATE.earned = 0;
  announce(S.boss ? `BOSS · STAGE ${i + 1}` : `STAGE ${i + 1}`, `${TOWNS[i % TOWNS.length].name} · ${S.name}, ${S.title}`, 100);
}

const demoA = makeFighter({ x: 210, facing: 1, color: '#2563c9', accent: '#ffd23f', name: 'A' });
const demoB = makeFighter({ x: 750, facing: -1, color: '#b8322a', accent: '#ff8a7a', name: 'B', weapon: 'bo' });

function update() {
  const go = pressed.enter || pressed[' '] || pressed.tap;
  switch (STATE.s) {
    case 'title':
      for (const d of [demoA, demoB]) {
        if (d.atk === 0 && Math.random() < 0.03) { d.atk = d.atkDur = WEAPONS[d.weapon].dur; }
        if (d.atk > 0) d.atk--;
      }
      if (frame % 120 === 0) {
        demoA.weapon = ORDER[(frame / 120) % ORDER.length];
        demoB.weapon = ORDER[(frame / 120 + 5) % ORDER.length];
      }
      setTown(0);
      updateLogo();
      camX += 1.5;
      if (go) { initAudio(); player = null; openMap(); }
      break;
    case 'select': {
      const n = STAGES.length;
      if (pressed.arrowleft || pressed.a) STATE.pick = Math.max(0, STATE.pick - 1);
      if (pressed.arrowright || pressed.d) STATE.pick = Math.min(n - 1, STATE.pick + 1);
      if (pressed.arrowup || pressed.w) STATE.pick = Math.max(0, STATE.pick - MAP_COLS);
      if (pressed.arrowdown || pressed.s) STATE.pick = Math.min(n - 1, STATE.pick + MAP_COLS);
      let start = pressed.enter || pressed[' '];
      if (tapAt) {
        const i = mapTileAt(tapAt.x, tapAt.y);
        if (i >= 0) { if (i === STATE.pick) start = true; else STATE.pick = i; }
        tapAt = null;
      }
      setTown(STATE.pick);
      camX += 1.2;
      if (pressed.escape) { STATE.s = 'title'; logo.t = 0; logo.drops = []; break; }
      if (start) {
        if (STATE.pick < progress.unlocked) { player = null; startStage(STATE.pick); }

    }
    case 'intro':
      STATE.t++;
      updateFighter(player, {}, enemy); updateFighter(enemy, {}, player);
      if (STATE.t === 100) { STATE.s = 'fight'; announce('FIGHT!', '', 45); sfx('special'); }
      break;
    case 'fight': {
      const pc = playerControls(), ec = aiControl(enemy, player, STAGES[STATE.stage]);
      const px = player.x, ex = enemy.x;
      updateFighter(player, pc, enemy); updateFighter(enemy, ec, player);
      separate(); leash(px, ex); updateProjs();
      if (pressed.escape) { openMap(); break; }
      if (player.dead || enemy.dead) { STATE.s = 'ko'; STATE.t = 0; announce('K.O.', '', 120); slow = 90; sfx('ko'); }

    }

      break;
    case 'lose':
      updateFighter(player, {}, enemy); updateFighter(enemy, {}, player);
      if (pressed.escape) openMap();
      else if (go) startStage(STATE.stage);
      break;

      updateFighter(player, {}, enemy); updateFighter(enemy, {}, player);

function tickAmbient() {
  for (const p of petals) {
    const fall = town ? town.T.fall : 1, fx = town ? town.T.fx : 'petal';
    p.x += fx === 'rain' ? 2.5 : fx === 'storm' ? 4 : p.vx + Math.sin(frame * 0.02 + p.rot) * (fx === 'leaf' ? 1.2 : 0.3);
    p.y += fx === 'firefly' ? Math.sin(frame * 0.03 + p.rot * 3) * 0.4 : p.vy * fall;
    p.rot += fx === 'leaf' ? 0.06 : 0.03;
    if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
    if (p.y < -12) { p.y = H; p.x = Math.random() * W; }
    if (p.x > W + 10) p.x = -10;
  }
  if (town) {
    updateRunners();
    const n = currentSeg(); if (n !== locName) { locName = n; locT = 0; } locT++;
  }
  if (town && town.T.fx === 'storm' && Math.random() < 0.004) { flashA = Math.max(flashA, 0.55); sfx('thunder'); }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.96; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) p.t++;

  if (ann && ++ann.t >= ann.max) ann = null;
  shake *= 0.88; flashA *= 0.88;
}

function tick() {
  frame++;

  if (slow > 0) { slow--; if (slow % 2) { clearPressed(); return; } }
  update();
  clearPressed();
}

function setTown(i) {
  if (townIdx === i && town) return;
  townIdx = i;
  const T = TOWNS[i], segs = [];
  let x = 0;
  for (const k of T.order) { segs.push({ k, x, w: SEG[k].w }); x += SEG[k].w + GAP; }
  const P = x;
  const [sky, sb] = mkLayer(W), [far, fb] = mkLayer(FAR_P), [mid, mb] = mkLayer(MID_P), [near, nb] = mkLayer(P);
  paintSky(sb, T, mkRnd(5 + i));
  paintTiled(fb, FAR_P, 21 + i, rnd => paintFar(fb, rnd, T));
  paintTiled(mb, MID_P, 41 + i, rnd => paintMid(mb, rnd, T));
  const lights = [];
  paintTiled(nb, P, 61 + i, (rnd, main) => paintNear(nb, rnd, T, i, segs, P, main ? lights : []));
  nb.save(); nb.globalCompositeOperation = 'source-atop'; nb.fillStyle = T.tint; nb.fillRect(0, 0, P, H); nb.restore();
  town = { i, T, sky, far, mid, near, P, segs, lights };
  runners = []; locName = '';
}

// Draw a looping layer: wrap the scroll offset into [0, P) and stitch the two pieces.
function drawLayer(img, scroll, P) {
  const off = ((scroll % P) + P) % P, w1 = Math.min(W, P - off);
  ctx.drawImage(img, off * dpr, 0, w1 * dpr, H * dpr, 0, 0, w1, H);
  if (w1 < W) ctx.drawImage(img, 0, 0, (W - w1 + 1) * dpr, H * dpr, w1 - 1, 0, W - w1 + 1, H);
}

function drawLight(L, x) {
  if (L.kind === 'eyes') {
    if ((frame + (L.x | 0) * 7) % 260 < 10) return;
    const g = ctx.createRadialGradient(x, L.y, 1, x, L.y, 18);
    g.addColorStop(0, 'rgba(255,220,120,0.35)'); g.addColorStop(1, 'rgba(255,220,120,0)');

  const g = ctx.createRadialGradient(x, L.y, 3, x, L.y, L.r);

      ctx.fillStyle = ['#ff6a1a', '#ffa53a', '#ffe08a'][k];
      ctx.beginPath(); ctx.ellipse(x + (k - 1) * 4, L.y - h / 2 + 6, 13 - k * 3.5, h / 2 * (1 - k * 0.2), 0, 0, Math.PI * 2); ctx.fill();

function updateRunners() {

  }
  const s = fx === 'ember' ? 0.6 : 1;
  for (const p of petals) { ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s * s, p.s * 0.55 * s, p.rot, 0, Math.PI * 2); ctx.fill(); }
}

function updateCam(snap) {
  const t = (player.x + enemy.x) / 2 - W / 2;
  camX = snap ? t : camX + (t - camX) * 0.1;
}

// Street Fighter rule: fighters can't get more than a screen apart. Whoever moved away gets stopped.
function leash(px, ex) {
  const d = enemy.x - player.x;
  if (Math.abs(d) <= MAXD) return;
  const s = Math.sign(d), excess = Math.abs(d) - MAXD;
  const pAway = Math.max(0, (px - player.x) * s), eAway = Math.max(0, (enemy.x - ex) * s), tot = pAway + eAway;
  const pShare = tot > 0 ? pAway / tot : 0.5;
  player.x += s * excess * pShare;
  enemy.x -= s * excess * (1 - pShare);
}

// ---------- Drawing: ninjas & weapons ----------
const REST = { katana: [0.5, -1.0], nunchaku: [0.9, -0.5], bo: [0.5, -0.25], kusarigama: [0.8, -1.0], shuriken: [1.1, 0],
  sai: [0.8, -0.2], tonfa: [0.9, -0.6], naginata: [0.5, -0.9], claws: [0.6, -0.1], blowgun: [0.3, -0.1],
  kunai: [1.0, -0.3], kama: [0.6, -1.2], tessen: [0.8, -1.0], kanabo: [0.3, -1.4], yumi: [0.0, 0],
  odachi: [0.2, -1.3], smoke: [1.0, 0], caltrops: [1.0, 0], yari: [0.4, -0.15], hook: [0.9, -0.3] };
function sw(p, rest, a, b) {
  if (p < 0.3) return lerp(rest, a, ease(p / 0.3));
  if (p < 0.7) return lerp(a, b, ease((p - 0.3) / 0.4));
  return lerp(b, rest, ease((p - 0.7) / 0.3));
}
function pose(f) {
  const k = f.weapon;
  let [arm, wpn] = REST[k], back = 1.9, lean = 0;
  arm += Math.sin(frame * 0.08) * 0.04;
  if (f.dead) { arm = 2.2; wpn = arm; }
  else if (f.stun > 0) { arm = -0.6; wpn = -1.4; lean = -4; back = 2.6; }
  else if (f.special) {
    const t = f.specT;
    switch (f.special) {
      case 'katana': arm = 0.1; wpn = 0.05; lean = 6; back = 2.8; break;
      case 'nunchaku': arm = Math.sin(t * 0.7) * 1.2 - 0.3; wpn = t * 0.9; lean = 3; break;
      case 'bo': if (!f.onGround) { arm = -2.0; wpn = -1.7; } else { arm = 0.9; wpn = 0.4; } lean = 3; break;
      case 'kusarigama': arm = -0.15; wpn = -0.4; lean = 4; break;
      case 'shuriken': arm = 0; wpn = t * 0.6; lean = 3; break;
      case 'sai': arm = -0.9; wpn = -1.3; back = -0.6; break;
      case 'tonfa': arm = t * 0.6; wpn = arm; back = arm + Math.PI; lean = 2; break;
      case 'naginata': arm = !f.onGround ? -1.6 + t * 0.12 : 0.8; wpn = arm - 0.3; lean = 4; break;
      case 'claws': arm = -0.3; wpn = 0; back = -0.2; lean = 6; break;
      case 'blowgun': arm = -0.15; wpn = -0.05; lean = 2; break;
      case 'kunai': arm = -1.5; wpn = -1.5; break;
      case 'kama': arm = t * 0.8; wpn = arm; back = arm + Math.PI; lean = 4; break;
      case 'tessen': arm = 0.2; wpn = -0.5; lean = 3; break;
      case 'kanabo': if (t < 20) { arm = -2.6; wpn = -2.4; lean = -3; } else { arm = 1.1; wpn = 1.0; lean = 8; } break;
      case 'yumi': arm = 0; wpn = 0; back = Math.PI; break;
      case 'odachi': arm = t < 8 ? -2.4 : 1.0; wpn = arm - 0.2; lean = t < 8 ? -3 : 7; break;
      case 'smoke': arm = -1.2; wpn = 0; break;
      case 'caltrops': arm = 0.2; wpn = 0; lean = 3; break;
      case 'yari': if (f.dive) { arm = 0.9; wpn = 1.0; } else { arm = -1.6; wpn = -1.4; } break;
      case 'hook': arm = -0.3; wpn = -0.2; lean = 3; break;
    }
  } else if (f.atk > 0) {
    const p = 1 - f.atk / f.atkDur;
    switch (k) {
      case 'katana': arm = sw(p, arm, -2.3, 1.1); wpn = arm - 0.15; lean = p > 0.3 && p < 0.75 ? 5 : 0; break;
      case 'nunchaku': arm = sw(p, arm, -1.6, 0.7); wpn = arm - 0.2; break;
      case 'bo': arm = sw(p, arm, 0.7, -0.05); wpn = sw(p, wpn, -1.3, 0.05); lean = p > 0.3 ? 6 : 0; break;
      case 'kusarigama': arm = sw(p, arm, -1.8, -0.1); wpn = arm - 0.6; break;
      case 'shuriken': arm = sw(p, arm, -2.2, 0.1); wpn = arm; break;
      case 'sai': arm = sw(p, arm, 1.3, -0.05); wpn = sw(p, wpn, -0.4, 0); lean = p > 0.3 && p < 0.75 ? 6 : 0; break;
      case 'tonfa': arm = sw(p, arm, -1.8, 0.9); wpn = arm - 0.2; break;
      case 'naginata': arm = sw(p, arm, -2.0, 1.0); wpn = arm - 0.3; lean = p > 0.3 && p < 0.75 ? 5 : 0; break;
      case 'claws': arm = sw(p, arm, -1.2, 0.6); wpn = arm; lean = 3; break;
      case 'blowgun': arm = -0.15; wpn = -0.05; lean = p < 0.4 ? -2 : 1; break;
      case 'kunai': arm = sw(p, arm, -2.2, 0.1); wpn = arm; break;
      case 'kama': arm = sw(p, arm, -2.0, 1.2); wpn = arm - 0.4; back = sw(p, 1.9, 1.2, -1.5); break;
      case 'tessen': arm = sw(p, arm, -1.4, 0.9); wpn = arm - 0.8; break;
      case 'kanabo': arm = sw(p, arm, -2.6, 1.2); wpn = arm - 0.1; lean = p > 0.3 && p < 0.8 ? 8 : -2; break;
      case 'yumi': arm = 0; wpn = 0; back = p < 0.4 ? Math.PI : 2.4; lean = p < 0.4 ? -2 : 0; break;
      case 'odachi': arm = sw(p, arm, -2.6, 1.3); wpn = arm - 0.2; lean = p > 0.3 && p < 0.8 ? 7 : -2; break;
      case 'smoke': arm = sw(p, arm, -2.4, -0.3); wpn = arm; break;
      case 'caltrops': arm = sw(p, arm, 1.6, -0.4); wpn = arm; break;
      case 'yari': arm = sw(p, arm, 0.9, -0.02); wpn = sw(p, wpn, -0.4, 0); lean = p > 0.3 && p < 0.75 ? 8 : 0; break;
      case 'hook': arm = sw(p, arm, -2.4, -0.2); wpn = arm; break;
    }
  } else if (f.block) { arm = -0.5; wpn = -1.55; back = -0.4; }
  return { arm, wpn, back, lean };
}

function drawStar(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#d4dbe4'; ctx.strokeStyle = '#59606b'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.35 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawKunai() {
  ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 3; line(-6, 0, 4, 0);
  ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(-9, 0, 3, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#d4dbe4'; ctx.beginPath(); ctx.moveTo(4, -3.5); ctx.lineTo(22, 0); ctx.lineTo(4, 3.5); ctx.closePath(); ctx.fill();
}

function drawBomb(x, y) {
  ctx.fillStyle = '#1e1e22'; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x - 2, y - 2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a08060'; ctx.lineWidth = 1.5; line(x + 4, y - 5, x + 8, y - 10);
  ctx.fillStyle = Math.random() < 0.5 ? '#ffd23f' : '#ff7a2a'; ctx.beginPath(); ctx.arc(x + 8, y - 10, 2, 0, Math.PI * 2); ctx.fill();
}
function drawCaltrop(x, y, r) {
  ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const a of [-Math.PI / 2, Math.PI / 6, Math.PI * 5 / 6]) line(x, y, x + Math.cos(a) * r, y + Math.sin(a) * r);
  line(x, y, x + r * 0.3, y + r * 0.5);
}
function drawHook(x, y) {
  ctx.strokeStyle = '#b8bec6'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  line(x - 4, y, x + 6, y);
  for (const sd of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(x + 6, y); ctx.quadraticCurveTo(x + 14, y + sd * 9, x + 8, y + sd * 12 + (sd ? 0 : 8)); ctx.stroke(); }
}

function drawWeapon(k, f) {
  ctx.lineCap = 'round';
  switch (k) {
    case 'katana': {
      ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = 5; line(-9, 0, 6, 0);
      ctx.fillStyle = '#c9a227'; ctx.fillRect(5, -5, 3, 10);
      ctx.fillStyle = '#dfe8f2';
      ctx.beginPath(); ctx.moveTo(8, -2.5); ctx.quadraticCurveTo(36, -5, 64, -3); ctx.lineTo(58, 1.5); ctx.quadraticCurveTo(34, 1, 8, 2.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(10, -2); ctx.quadraticCurveTo(36, -4.5, 60, -3); ctx.stroke();
      break;
    }
    case 'nunchaku': {
      let rel;
      if (f.special) rel = Math.sin(frame * 0.9) * 2.2;
      else if (f.atk > 0) rel = -(1 - f.atk / f.atkDur - 0.3) * 5;
      else rel = 0.9 + Math.sin(frame * 0.1) * 0.2;
      ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 5; line(-4, 0, 16, 0);
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 5; line(15, 0, 17, 0);
      ctx.save(); ctx.translate(18, 0); ctx.rotate(rel);
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.5; line(0, 0, 7, 0);
      ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 5; line(8, 0, 28, 0);
      ctx.strokeStyle = '#c9a227'; line(8, 0, 10, 0);
      ctx.restore();
      break;
    }
    case 'bo':
      ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 5; line(-48, 0, 72, 0);
      ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 6; line(-48, 0, -40, 0); line(64, 0, 72, 0); line(8, 0, 14, 0);
      break;
    case 'kusarigama':
      ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 4; line(-2, 0, 16, 0);
      ctx.fillStyle = '#d8dee6';
      ctx.beginPath(); ctx.moveTo(15, -2); ctx.quadraticCurveTo(29, -4, 31, 11); ctx.quadraticCurveTo(25, 2, 15, 2); ctx.closePath(); ctx.fill();
      break;
    case 'shuriken':
      if (!(f.atk > 0 && f.hasHit)) drawStar(6, 0, 7, frame * 0.05);
      break;
    case 'sai':
      ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 4; line(-6, 0, 5, 0);
      ctx.strokeStyle = '#cfd6df'; ctx.lineWidth = 3; line(6, 0, 40, 0);
      ctx.lineWidth = 2;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(9, s * 7); ctx.lineTo(19, s * 7); ctx.stroke(); }
      break;
    case 'tonfa':
      ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 5; line(-14, 0, 34, 0);
      ctx.lineWidth = 4; line(4, 0, 4, 10);
      ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 6; line(32, 0, 34, 0);
      break;
    case 'naginata':
      ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 4; line(-40, 0, 70, 0);
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 6; line(68, 0, 72, 0);
      ctx.fillStyle = '#dfe8f2';
      ctx.beginPath(); ctx.moveTo(72, -3); ctx.quadraticCurveTo(95, -4, 112, -13); ctx.quadraticCurveTo(100, 3, 72, 3); ctx.closePath(); ctx.fill();
      break;
    case 'claws':
      ctx.fillStyle = '#3b2412'; ctx.fillRect(-4, -6, 6, 12);
      ctx.strokeStyle = '#cfd6df'; ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(1, i * 3.5); ctx.quadraticCurveTo(11, i * 3.5 - 2, 20, i * 4.5 + 2); ctx.stroke(); }
      break;
    case 'kunai':
      if (f.atk > 0 && f.hasHit) break;
      drawKunai();
      break;
    case 'kama':
      drawWeapon('kusarigama', f);
      ctx.save(); ctx.rotate(0.5); ctx.translate(-4, 5); drawWeapon('kusarigama', f); ctx.restore();
      break;
    case 'tessen':
      if (f.atk > 0 || f.special === 'tessen') {
        ctx.fillStyle = f.accent; ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 32, -0.9, 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
        for (let a = -0.9; a <= 0.91; a += 0.3) line(0, 0, Math.cos(a) * 32, Math.sin(a) * 32);
      } else { ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 5; line(0, 0, 28, 0); ctx.strokeStyle = f.accent; ctx.lineWidth = 2; line(4, 0, 26, 0); }
      break;
    case 'kanabo':
      ctx.strokeStyle = '#3b2412'; ctx.lineWidth = 5; line(-6, 0, 10, 0);
      ctx.fillStyle = '#3d3d44';
      ctx.beginPath(); ctx.moveTo(10, -4); ctx.lineTo(54, -9); ctx.lineTo(54, 9); ctx.lineTo(10, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a8aeb6';
      for (let x = 18; x <= 50; x += 8) for (const y of [-1, 1]) { ctx.beginPath(); ctx.arc(x, y * (3 + (x - 10) * 0.1), 1.6, 0, Math.PI * 2); ctx.fill(); }
      break;
    case 'odachi':
      ctx.save(); ctx.scale(1.55, 1.15); drawWeapon('katana', f); ctx.restore();
      ctx.strokeStyle = '#2b1a10'; ctx.lineWidth = 5; line(-22, 0, -10, 0);
      break;
    case 'smoke':
      if (f.atk > 0 && f.hasHit) break;
      drawBomb(8, 0);
      break;
    case 'caltrops':
      if (f.atk > 0 && f.hasHit) break;
      drawCaltrop(6, 0, 6);
      break;
    case 'yari':
      ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 4; line(-40, 0, 90, 0);
      ctx.fillStyle = '#d4dbe4';
      ctx.beginPath(); ctx.moveTo(88, -4); ctx.lineTo(120, 0); ctx.lineTo(88, 4); ctx.closePath(); ctx.fill();
      for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(90, 0); ctx.quadraticCurveTo(92, sd * 14, 102, sd * 16); ctx.lineTo(96, sd * 9); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = '#c9a227'; ctx.fillRect(84, -3, 5, 6);
      break;
    case 'hook':
      ctx.strokeStyle = '#8a6a44'; ctx.lineWidth = 2;
      for (const r of [5, 8]) { ctx.beginPath(); ctx.arc(0, 4, r, 0, Math.PI * 2); ctx.stroke(); }
      drawHook(10, 0);
      break;
    case 'yumi': {
      const pulling = f.special === 'yumi' ? f.specT < 10 : f.atk > 0 && !f.hasHit;
      ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(-10, 0, 38, -1.1, 1.1); ctx.stroke();
      const ex = -10 + 38 * Math.cos(1.1), ey = 38 * Math.sin(1.1), sx = pulling ? -24 : ex;
      ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ex, -ey); ctx.lineTo(sx, 0); ctx.lineTo(ex, ey); ctx.stroke();
      if (pulling) { ctx.strokeStyle = '#d8c79a'; ctx.lineWidth = 2; line(sx, 0, 34, 0); }
      break;
    }
    case 'blowgun':
      ctx.strokeStyle = '#8a7a42'; ctx.lineWidth = 4; line(-10, 0, 48, 0);
      ctx.strokeStyle = '#4e4520'; ctx.lineWidth = 5; for (const x of [6, 26]) line(x, 0, x + 1.5, 0);
      break;
  }
}

function drawNinja(f, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(f.x, f.y);
  ctx.scale(f.facing, 1);
  if (f.dead) ctx.rotate(-f.deadT * 1.45);
  const flash = f.flash > 0 && (f.flash >> 1) % 2 === 0;
  const body = flash ? '#ffffff' : f.color, dk = flash ? '#dddddd' : shade(f.color, -0.4);
  const P = pose(f);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const sx = P.lean, sy = -58;

  // back arm
  ctx.strokeStyle = dk; ctx.lineWidth = 7;
  line(sx, sy, sx + Math.cos(P.back) * 20, sy + Math.sin(P.back) * 20);

  // legs
  let l1, l2;
  const moving = Math.abs(f.vx) > 0.6 && f.onGround;
  if (!f.onGround && !f.dead) { l1 = [-12, -10]; l2 = [12, -16]; }
  else if (f.block) { l1 = [-16, 0]; l2 = [16, 0]; }
  else { const s = moving ? Math.sin(f.walk) * 14 : 0; l1 = [-7 + s, 0]; l2 = [7 - s, 0]; }
  const leg = (ft, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(ft[0] / 2 + 5, (ft[1] - 34) / 2); ctx.lineTo(ft[0], ft[1]); ctx.stroke();
  };
  leg(l1, dk); leg(l2, body);

  // torso
  ctx.strokeStyle = body; ctx.lineWidth = 17; line(0, -36, sx, -60);
  ctx.fillStyle = f.accent; ctx.fillRect(-9 + sx * 0.2, -41, 18, 5);

  // head
  const hx = sx + 3, hy = -74;
  ctx.strokeStyle = f.accent; ctx.lineWidth = 3;
  for (let i = 0; i < 2; i++) {
    const wv = Math.sin(frame * 0.2 + i * 1.5) * 4;
    ctx.beginPath(); ctx.moveTo(hx - 9, hy - 6);
    ctx.quadraticCurveTo(hx - 18, hy - 6 + i * 3 + wv * 0.5, hx - 28 - i * 4, hy - 2 + i * 6 + wv);
    ctx.stroke();
  }
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(hx, hy, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = f.accent; ctx.fillRect(hx - 11, hy - 9, 22, 4);
  ctx.fillStyle = flash ? '#fff' : '#f2c9a0'; ctx.fillRect(hx - 1, hy - 3, 12, 5);
  ctx.fillStyle = f.dead ? '#555' : '#111'; ctx.fillRect(hx + 6, hy - 2, 2.5, 3);

  // front arm + weapon
  const ax = sx + Math.cos(P.arm) * 22, ay = sy + Math.sin(P.arm) * 22;
  const w = WEAPONS[f.weapon];
  if (f.weapon === 'kusarigama' && f.atk > 0) {
    const p = 1 - f.atk / f.atkDur;
    const len = w.range * Math.sin(Math.PI * clamp((p - 0.15) / 0.7, 0, 1));
    if (len > 4) {
      const ex = ax + len, ey = ay - 6 + Math.sin(p * 9) * 6;
      ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + ex) / 2, ey + 14, ex, ey); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#5b6068'; ctx.beginPath(); ctx.arc(ex, ey, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
  // swing trail
  if (f.atk > 0 && !w.ranged && f.weapon !== 'kusarigama' && f.weapon !== 'yari') {
    const p = 1 - f.atk / f.atkDur;
    if (p > 0.3 && p < 0.75) {
      const r = { odachi: 130, bo: 90, katana: 78, naginata: 125, tonfa: 58, sai: 60, kama: 62, tessen: 62, kanabo: 75 }[f.weapon] || 52;
      ctx.strokeStyle = `rgba(255,255,255,${f.weapon === 'katana' ? 0.4 : 0.25})`; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(sx, sy, r, P.wpn - 1.1, P.wpn); ctx.stroke();
    }
  }
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(P.wpn); drawWeapon(f.weapon, f); ctx.restore();
  ctx.strokeStyle = body; ctx.lineWidth = 7; line(sx, sy, ax, ay);
  ctx.fillStyle = dk; ctx.beginPath(); ctx.arc(ax, ay, 4, 0, Math.PI * 2); ctx.fill();

  if (f.block) {
    ctx.strokeStyle = `rgba(140,200,255,${f.blockFlash ? 0.9 : 0.4})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(14, -50, 40, -1.2, 1.2); ctx.stroke();
  }
  if (f.energy >= 100 && !f.dead) {
    ctx.strokeStyle = f.accent; ctx.globalAlpha = alpha * (0.3 + Math.sin(frame * 0.2) * 0.2); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -45, 30, 55, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

function drawShadow(f) {
  const h = clamp((GROUND - f.y) / 150, 0, 1);
  ctx.fillStyle = `rgba(0,0,0,${0.4 - h * 0.25})`;
  ctx.beginPath(); ctx.ellipse(f.x, GROUND + 2, 26 * (1 - h * 0.4), 6, 0, 0, Math.PI * 2); ctx.fill();
}

function drawProjs() {
  for (const p of projs) {
    if (p.type === 'shuriken') {
      ctx.fillStyle = 'rgba(220,230,255,0.15)'; ctx.beginPath(); ctx.arc(p.x - p.vx, p.y - (p.vy || 0), 10, 0, Math.PI * 2); ctx.fill();
      drawStar(p.x, p.y, 9, p.rot);
    } else if (p.type === 'bomb') {
      drawBomb(p.x, p.y);
    } else if (p.type === 'caltrop') {
      drawCaltrop(p.x, p.y, 7);
    } else if (p.type === 'hook') {
      const o = p.owner;

// ---------- Stage map ----------
const MAP_COLS = 8, MAP_TW = 100, MAP_TH = 58, MAP_GAP = 10, MAP_Y0 = 88;

    ctx.lineWidth = sel ? 3 : 1.5; ctx.strokeStyle = sel ? '#fff' : S.boss ? '#ffd23f' : 'rgba(255,255,255,0.25)'; ctx.stroke();
    ctx.textAlign = 'left'; ctx.font = 'bold 18px Impact, "Arial Black", sans-serif';
    ctx.fillStyle = locked ? 'rgba(255,255,255,0.35)' : '#fff'; ctx.fillText(String(i + 1), x + 8, y + 22);
    if (S.boss) { ctx.textAlign = 'right'; ctx.font = 'bold 10px system-ui, sans-serif'; ctx.fillStyle = '#ffd23f'; ctx.fillText('BOSS', x + MAP_TW - 7, y + 16); }
    ctx.textAlign = 'left'; ctx.font = '11px system-ui, sans-serif';
    ctx.fillStyle = locked ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.92)';
    ctx.fillText(locked ? '🔒 Locked' : S.name, x + 8, y + 39);
    if (!locked) { const st = progress.stars[i] || 0; ctx.fillStyle = '#ffd23f'; ctx.fillText('★'.repeat(st) + '☆'.repeat(3 - st), x + 8, y + 52); }
  });
  const i = STATE.pick, S = STAGES[i], T = TOWNS[i], locked = i >= progress.unlocked;
  const cleared = Object.keys(progress.stars).length, stars = Object.values(progress.stars).reduce((a, b) => a + b, 0);
  ctx.textAlign = 'center'; ctx.font = 'bold 19px Georgia, serif'; ctx.fillStyle = '#fff';
  ctx.fillText(`Stage ${i + 1}: ${T.name}`, W / 2, 452);
  smallText(locked ? 'Clear the previous stage to unlock' : `vs ${S.name}, ${S.title} — ${WEAPONS[S.weapon].name}${S.boss ? '  ·  BOSS' : ''}`, 476, 15, locked ? 'rgba(255,255,255,0.55)' : '#ffd23f');
  smallText(isTouch ? 'Tap a stage, tap again to fight' : 'Arrows / WASD to choose  ·  ENTER to fight  ·  ESC back', 504, 13, 'rgba(255,255,255,0.6)');
  smallText(`${cleared} / ${STAGES.length} cleared  ·  ★ ${stars} / ${STAGES.length * 3}`, 526, 13, 'rgba(255,255,255,0.75)');

// ---------- Title logo: gritty spray-paint on a black airbrushed plank sign ----------
const LOGO_H = 250, LOGO_BASE = 150;
const logo = { built: false, t: 0, sliceT: -1, drips: [], drops: [], mouths: [] };
const logoFont = s => `${s}px Anton, Impact, "Arial Narrow", sans-serif`;
function logoCanvas() {
  const c = document.createElement('canvas'); c.width = W * dpr; c.height = LOGO_H * dpr;
  const b = c.getContext('2d'); b.scale(dpr, dpr); return [c, b];
}
function buildLogo() {
  const rnd = mkRnd(4242), cx = W / 2, txt = 'SHADOW BLADES';
  // Black airbrushed patch with dry-brush edges and plank seams.
  const [pc, pb] = logoCanvas();
  for (let y = 26; y < 222; y += 3) {
    const edge = Math.min(1, (y - 26) / 30, (222 - y) / 30), hw = (330 + rnd() * 50) * (0.75 + 0.25 * edge);
    pb.strokeStyle = `rgba(0,0,0,${0.5 + rnd() * 0.25})`; pb.lineWidth = 4; ln(pb, cx - hw, y, cx + hw, y);
    for (const d of [-1, 1]) for (let k = 0; k < 3; k++) {
      const x0 = cx + d * hw, len = 20 + rnd() * 90, off = (rnd() - 0.5) * 2;
      pb.strokeStyle = `rgba(0,0,0,${0.12 + rnd() * 0.3})`; pb.lineWidth = 1 + rnd() * 2; ln(pb, x0, y + off, x0 + d * len, y + off);
    }

  for (let y = 44; y < 222; y += 38) { pb.fillStyle = 'rgba(255,235,210,0.08)'; pb.fillRect(0, y, W, 2); pb.fillStyle = 'rgba(0,0,0,0.5)'; pb.fillRect(0, y + 2, W, 2); }
  for (let k = 0; k < 90; k++) { pb.fillStyle = 'rgba(255,230,200,0.04)'; pb.fillRect(rnd() * W, 26 + rnd() * 196, 30 + rnd() * 120, 1); }
  pb.restore();

  // Lettering: hot orange-red spray paint with dark edges, grime, scratches and plank gaps.
  const [tc, tb] = logoCanvas(), [gc, gb] = logoCanvas();
  let size = 124; tb.font = logoFont(size);
  while (tb.measureText(txt).width > 700 && size > 50) { size -= 4; tb.font = logoFont(size); }
  const tw = tb.measureText(txt).width;
  tb.textAlign = 'center'; tb.textBaseline = 'alphabetic';
  const rg = tb.createRadialGradient(cx, LOGO_BASE - size * 0.4, 20, cx, LOGO_BASE - size * 0.4, 380);
  rg.addColorStop(0, '#ff9a4a'); rg.addColorStop(0.45, '#f2481c'); rg.addColorStop(1, '#a8140a');
  tb.fillStyle = rg; tb.fillText(txt, cx, LOGO_BASE);
  tb.save(); tb.globalCompositeOperation = 'source-atop';
  tb.lineWidth = 7; tb.strokeStyle = 'rgba(90,0,0,0.75)'; tb.strokeText(txt, cx, LOGO_BASE);
  for (let k = 0; k < 260; k++) {
    tb.fillStyle = `rgba(${rnd() < 0.7 ? '70,0,0' : '255,170,90'},${0.12 + rnd() * 0.3})`;
    tb.beginPath(); tb.arc(rnd() * W, LOGO_BASE - size + rnd() * size * 1.05, 1 + rnd() * 4, 0, Math.PI * 2); tb.fill();
  }
  tb.strokeStyle = 'rgba(60,0,0,0.35)'; tb.lineWidth = 1;
  for (let k = 0; k < 70; k++) { const x = rnd() * W, y = LOGO_BASE - size + rnd() * size; ln(tb, x, y, x + (rnd() - 0.5) * 30, y + (rnd() - 0.5) * 30); }
  for (let y = 44; y < 222; y += 38) { tb.fillStyle = 'rgba(0,0,0,0.85)'; tb.fillRect(0, y, W, 3); }
  tb.restore();
  tb.save(); tb.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 500; k++) { tb.fillStyle = `rgba(0,0,0,${rnd() * 0.8})`; tb.fillRect(rnd() * W, LOGO_BASE - size + rnd() * size * 1.05, 1 + rnd() * 2.5, 1 + rnd() * 2.5); }
  tb.restore();

  // Find where drips can start: the lowest painted pixel of each column of the lettering.

  for (let x = cx - tw / 2; x < cx + tw / 2; x += 2) {
    const px = Math.round(x * dpr);
    for (let y = LOGO_BASE + 6; y > LOGO_BASE - 40; y--) if (data[(Math.round(y * dpr) * tc.width + px) * 4 + 3] > 180) { mouths.push({ x, y }); break; }
  }

  // Spray-paint dashes and the serif tagline.

    for (let x = x0; x < x1;) { const len = 14 + rnd() * 46; tb.beginPath(); tb.ellipse(x + len / 2, y, len / 2, 3.2, 0, 0, Math.PI * 2); tb.fill(); x += len + 10 + rnd() * 26; }
  };
  tb.fillStyle = '#ff7a3a'; tb.shadowColor = 'rgba(255,110,40,0.9)'; tb.shadowBlur = 12;
  dashes(cx - 60, cx + tw / 2 - 10, LOGO_BASE - size * 0.95 - 10);
  dashes(cx - tw / 2 + 10, cx - 30, LOGO_BASE + 34);
  tb.textAlign = 'right'; tb.fillStyle = '#d42a18'; tb.shadowColor = 'rgba(0,0,0,0.8)'; tb.shadowBlur = 4;
  tb.font = '700 24px Cinzel, "Trajan Pro", Georgia, serif'; tb.fillText('WAY OF THE BLADE', cx + tw / 2, LOGO_BASE + 44);
  const tagW = tb.measureText('WAY OF THE BLADE').width;
  tb.font = '28px "Yuji Boku", "Hiragino Mincho ProN", serif'; tb.fillText('影刃', cx + tw / 2 - tagW - 14, LOGO_BASE + 45);
  tb.shadowBlur = 0;

  // Airbrush glow halo, drawn separately so it can flicker.

  gb.fillStyle = 'rgba(255,90,20,0.7)'; gb.fillText(txt, cx, LOGO_BASE); gb.fillText(txt, cx, LOGO_BASE);

  Object.assign(logo, { built: true, patch: pc, text: tc, glow: gc, mouths, drips: [], drops: [] });

  for (let k = 0; k < 9; k++) logo.drips.push(newDrip());

function newDrip() {

}
const LOGO_SLICE = { a: -0.1, cx: W / 2, cy: LOGO_BASE - 45 };
function updateLogo() {

  const t = ++logo.t, revX = W / 2 - 380 + t * 22;

    else { logo.drops.push({ x: d.x, y: d.y + d.len, vx: 0, vy: 1, r: d.w * 0.85 }); Object.assign(d, newDrip()); }
  }
  for (const p of logo.drops) { if (!p.spray) p.vy += 0.3; p.x += p.vx; p.y += p.vy; if (p.life !== undefined) p.life--; }
  logo.drops = logo.drops.filter(p => p.y < H && (p.life === undefined || p.life > 0));
  if (logo.sliceT < 0 && t > 90 && t % 420 === 0) logo.sliceT = 0;
  if (logo.sliceT >= 0) {
    const s = ++logo.sliceT, { a, cx, cy } = LOGO_SLICE;
    if (s === 2) sfx('swing');
    if (s === 5) for (let k = 0; k < 60; k++) {
      const d = (Math.random() - 0.5) * 700;
      logo.drops.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 5, r: 1 + Math.random() * 2.5 });
    }
    if (s > 44) logo.sliceT = -1;
  }
}
function drawLogo() {
  if (!logo.built) buildLogo();
  const t = logo.t, revX = W / 2 - 380 + t * 22, s = logo.sliceT, { a, cx, cy } = LOGO_SLICE;
  const dx = Math.cos(a), dy = Math.sin(a);
  const split = s >= 6 ? Math.sin(Math.min(1, (s - 6) / 34) * Math.PI) * 12 : 0;
  const flick = 0.55 + Math.sin(frame * 0.07) * 0.12 + Math.random() * 0.12;
  ctx.save(); ctx.globalAlpha = Math.min(1, t / 20); ctx.drawImage(logo.patch, 0, 0, W, LOGO_H); ctx.restore();
  const piece = side => {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, revX, LOGO_H); ctx.clip();
    if (side) {
      ctx.beginPath(); ctx.moveTo(cx - dx * 1000, cy - dy * 1000); ctx.lineTo(cx + dx * 1000, cy + dy * 1000);
      ctx.lineTo(cx + dx * 1000, cy + dy * 1000 + side * 1000); ctx.lineTo(cx - dx * 1000, cy - dy * 1000 + side * 1000); ctx.closePath(); ctx.clip();
      ctx.translate(-side * dx * split, -side * dy * split + side * 2);
    }
    ctx.globalAlpha = flick; ctx.drawImage(logo.glow, 0, 0, W, LOGO_H);
    ctx.globalAlpha = 1; ctx.drawImage(logo.text, 0, 0, W, LOGO_H);
    ctx.restore();
  };
  if (split) { piece(-1); piece(1); } else piece(0);
  if (s >= 0 && s < 10) {
    ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${1 - s / 10})`; ctx.lineWidth = 13 - s;
    ctx.shadowColor = 'rgba(255,60,40,0.9)'; ctx.shadowBlur = 20;
    line(cx - dx * 480, cy - dy * 480, cx + dx * 480, cy + dy * 480); ctx.restore();
  }
  if (revX > W / 2 + 380) for (const d of logo.drips) {
    if (d.len < 0.5) continue;
    ctx.fillStyle = '#8e0c06'; ctx.fillRect(d.x - d.w / 2, d.y, d.w, d.len);
    ctx.beginPath(); ctx.arc(d.x, d.y + d.len, d.w * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,140,110,0.35)'; ctx.fillRect(d.x - d.w / 2 + 0.4, d.y, 0.8, d.len);
  }
  for (const p of logo.drops) {
    ctx.fillStyle = p.spray ? `rgba(255,110,40,${p.life / 20})` : '#8e0c06';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
}
if (document.fonts) {
  Promise.all([document.fonts.load(logoFont(124), 'SHADOW'), document.fonts.load('700 24px Cinzel', 'WAY'), document.fonts.load('28px "Yuji Boku"', '影刃')])
    .then(() => { logo.built = false; }).catch(() => {});
}

function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, 0, W, H);
  drawShadow(demoA); drawShadow(demoB); drawNinja(demoA); drawNinja(demoB);
  drawLogo();
  smallText(`Master twenty ninja weapons. Defeat ${STAGES.length} rivals across ${TOWNS.length} towns.`, 238, 18, 'rgba(255,255,255,0.8)');
  const rows = isTouch
    ? ['◀ ▶ move · ▲ jump · ⚔ attack · 🛡 block · ★ special · ⟳ switch weapon']
    : ['MOVE  A / D     JUMP  W     ATTACK  J     BLOCK  K     SPECIAL  L',
       '1 Katana · 2 Nunchaku · 3 Bo · 4 Kusarigama · 5 Shuriken · 6 Sai · 7 Tonfa',
       '8 Naginata · 9 Tekko-kagi · 0 Fukiya · R Kunai · T Twin Kama · Y Tessen · U Kanabo',
       'I Yumi · O Ōdachi · P Kemuridama · F Tetsubishi · G Yari · H Kaginawa   (Q / E cycle, or click a slot)'];
  rows.forEach((r, i) => smallText(r, 262 + i * 21, 14, 'rgba(255,255,255,0.75)'));
  smallText('Land hits to charge your special. Blocking cuts damage but roots you in place.', 350, 13, 'rgba(255,255,255,0.55)');
  smallText(`${WEAPONS[demoA.weapon].name}  vs  ${WEAPONS[demoB.weapon].name}`, 500, 14, 'rgba(255,210,63,0.8)');
  if ((frame >> 5) % 2 === 0) smallText(isTouch ? 'TAP TO BEGIN' : 'PRESS ENTER FOR THE STAGE MAP', 414, 22, '#ffd23f');
  const cleared = Object.keys(progress.stars).length;
  ctx.font = 'bold 17px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText(`${STAGES.length} stages  ·  ${cleared} cleared  ·  every 5th stage is a boss`, W / 2, 378);
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(town.sky, 0, 0, town.sky.width, town.sky.height, -12, -12, W + 24, H + 24);
  drawLayer(town.far, camX * PAR.far, FAR_P); drawLayer(town.mid, camX * PAR.mid, MID_P); drawRunners(); drawLayer(town.near, camX, town.P);
  ctx.save(); ctx.translate(-camX, 0);
  drawLights();
  if (STATE.s === 'title' || STATE.s === 'select') {
    ctx.restore(); drawPetals(); ctx.restore();
    if (flashA > 0.02) { ctx.fillStyle = `rgba(255,255,255,${flashA})`; ctx.fillRect(0, 0, W, H); }
    if (STATE.s === 'title') drawTitle(); else drawMap();
    return;
  }
  for (const f of [enemy, player]) drawShadow(f);
  for (const f of [enemy, player]) f.trail.forEach((t, i) => drawNinja(Object.assign({}, f, { x: t.x, y: t.y, special: f.special }), 0.08 + i * 0.04));
  drawNinja(enemy); drawNinja(player);
  drawProjs(); drawParts();
  ctx.restore();
  drawPetals();
  ctx.restore();
  if (flashA > 0.02) { ctx.fillStyle = `rgba(255,255,255,${flashA})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  drawAnnounce();
  if (STATE.s === 'cleared') {
    const N = STAGES[STATE.stage + 1];
    drawOverlay('STAGE CLEAR', [`${'★'.repeat(STATE.earned)}${'☆'.repeat(3 - STATE.earned)}`, `Next: Stage ${STATE.stage + 2} · ${TOWNS[STATE.stage + 1].name}`, `${N.name}, ${N.title} — wields the ${WEAPONS[N.weapon].name}`], '#3ddc84', 'ENTER: next stage   ·   ESC: stage map');
  } else if (STATE.s === 'lose') {
    drawOverlay('DEFEATED', [`${STAGES[STATE.stage].name} wins this time.`, 'Try a different weapon!'], '#ff4d4d', 'ENTER: retry   ·   ESC: stage map');
  } else if (STATE.s === 'victory') {
    drawOverlay('VICTORY', ['You are the Shadow Master.', `All ${STAGES.length} rivals have fallen.`], '#ffd23f', 'ENTER: stage map');
  }
}

// ---------- Boot ----------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  if (townIdx >= 0) { const i = townIdx; townIdx = -1; setTown(i); } else setTown(0);
  logo.built = false;
}
addEventListener('resize', resize);
resize();

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
